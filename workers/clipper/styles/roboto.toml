description = "Full-bleed, plain sans captions"

# Latin only.
#
# Sizes are fractions of canvas height, so a style survives a resolution
# change. 59px on a 1920-tall canvas was calibrated by measuring
# rendered ink height, not by the nominal em -- faces differ enough that
# equal point sizes are not equal on screen.

[canvas]
bg = "#000000"          # never seen: the video covers the frame

[video]
mode = "full"

[headline]
enabled = false

[captions]
font = "Roboto-Variable.ttf"
script = "roman"
size_pct = 0.0307
fill = "#FFFFFF"
outline = "#000000"
outline_px = 4
box = false
anchor = "canvas"
pos = "bottom"
inset_pct = 0.12
max_width = 0.86
bold = true
shadow_px = 2
fade_in_ms = 180
fade_out_ms = 60
