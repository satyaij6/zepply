  lang="en"

    {"id":"highlightsHeadline","type":"string","label":"Highlights headline","default":"The little things, *done right*."},

  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter Tight";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("fonts/InterTight-Latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Instrument Serif";
        font-style: italic;
        font-weight: 400;
        font-display: block;
        src: url("fonts/InstrumentSerif-Italic.woff2") format("woff2");
      }
      @font-face {
        font-family: "Noto Sans Telugu";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("fonts/NotoSansTelugu.woff2") format("woff2");
        unicode-range: U+0951-0952, U+0964-0965, U+0C00-0C7F, U+1CDA, U+1CF2, U+200C-200D, U+25CC;
      }
      @font-face {
        font-family: "Noto Sans Devanagari";
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
        src: url("fonts/NotoSansDevanagari.woff2") format("woff2");
        unicode-range: U+0900-097F, U+1CD0-1CF9, U+200C-200D, U+20A8, U+20B9, U+20F0, U+25CC, U+A830-A839, U+A8E0-A8FF, U+11B00-11B09;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        overflow: hidden;
        background: #08080b;
        font-family: "Inter Tight", "Noto Sans Telugu", "Noto Sans Devanagari", sans-serif;
        color: #f4f4f5;
        -webkit-font-smoothing: antialiased;
        font-feature-settings: "tnum" 0;
      }
      #ground,
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #ground {
        background: #08080b;
      }
      .glow {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .scene {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        visibility: hidden;
      }
      .abs {
        position: absolute;
      }

      /* headline: display role, one accent word in serif italic */
      .headline {
        position: absolute;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.04;
        color: #f4f4f5;
      }
      .headline .w {
        display: inline-block;
        white-space: pre;
      }
      .serif {
        font-family: "Instrument Serif", "Noto Sans Telugu", "Noto Sans Devanagari", serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: var(--silver);
      }

      /* silver paper product card */
      .card {
        position: absolute;
        background: linear-gradient(180deg, #f5f6fa 0%, #e9ebf3 100%);
        border: 1px solid #d9dce6;
        border-radius: 34px;
        box-shadow:
          0 2px 0 rgba(255, 255, 255, 0.6) inset,
          0 40px 80px -30px rgba(0, 0, 0, 0.7),
          0 12px 30px -10px rgba(0, 0, 0, 0.45);
        color: #0f1020;
        overflow: hidden;
      }

      /* the phone */
      #phone {
        position: absolute;
        border-radius: 56px;
        background: #101015;
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
        box-shadow: 0 50px 120px -40px rgba(0, 0, 0, 0.9);
      }
      #phone .screen {
        position: absolute;
        inset: 10px;
        border-radius: 46px;
        overflow: hidden;
        background: radial-gradient(120% 70% at 50% 100%, var(--accent-deep) 0%, #0b0b12 60%);
      }
      #phone .island {
        position: absolute;
        top: 22px;
        left: 50%;
        width: 32%;
        height: 30px;
        margin-left: -16%;
        border-radius: 20px;
        background: #000;
      }
      #phone .date {
        position: absolute;
        width: 100%;
        text-align: center;
        font-weight: 500;
        color: rgba(244, 244, 245, 0.75);
      }
      #phone .time {
        position: absolute;
        width: 100%;
        text-align: center;
        font-weight: 600;
        letter-spacing: -0.04em;
        color: #f4f4f5;
      }
      #phone .notif {
        position: absolute;
        border-radius: 26px;
        background: rgba(40, 40, 52, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
      }
      #phone .notif .app {
        flex: none;
        border-radius: 12px;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #phone .notif .txt {
        flex: 1;
        min-width: 0;
        line-height: 1.25;
      }
      #phone .notif .t1 {
        font-weight: 600;
        color: #f4f4f5;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #phone .notif .t2 {
        color: rgba(244, 244, 245, 0.82);
      }
      #phone .badge {
        position: absolute;
        border-radius: 999px;
        background: #ff3b5c;
        color: #fff;
        font-weight: 700;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      #phone .dim {
        position: absolute;
        inset: 0;
        background: #101015;
      }

      .bubble {
        position: absolute;
        display: flex;
        align-items: center;
        border-radius: 999px;
        background: #f5f6fa;
        color: #0f1020;
        font-weight: 500;
        white-space: nowrap;
        box-shadow: 0 14px 30px -12px rgba(0, 0, 0, 0.6);
      }
      .bubble .av {
        flex: none;
        border-radius: 50%;
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ghost {
        position: absolute;
        border-radius: 999px;
        background: #2a2a34;
      }

      /* DM */
      .dm-head {
        display: flex;
        align-items: center;
        border-bottom: 1px solid #d9dce6;
      }
      .dm-av {
        flex: none;
        border-radius: 50%;
        background: linear-gradient(135deg, #d9773a, #c2416a);
        color: #fff;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dm-name {
        font-weight: 650;
        color: #0f1020;
      }
      .dm-sub {
        color: #5c6070;
      }
      .msg {
        position: absolute;
        line-height: 1.32;
        font-weight: 500;
      }
      .msg.in {
        background: #ffffff;
        border: 1px solid #d9dce6;
        color: #0f1020;
      }
      .msg.out {
        background: var(--accent);
        color: var(--on-accent);
      }
      .typing {
        position: absolute;
        background: #ffffff;
        border: 1px solid #d9dce6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .typing i {
        display: block;
        border-radius: 50%;
        background: #9aa0b2;
      }
      .chip {
        position: absolute;
        display: flex;
        align-items: center;
        border-radius: 999px;
        background: #dff5ea;
        color: #0c6b48;
        font-weight: 600;
        white-space: nowrap;
      }
      .dm-input {
        position: absolute;
        border-radius: 999px;
        background: #ffffff;
        border: 1px solid #d9dce6;
        color: #6b7080;
        display: flex;
        align-items: center;
      }

      /* gallery */
      .card-title {
        position: absolute;
        font-weight: 650;
        color: #0f1020;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .card-title .dot {
        display: inline-block;
        border-radius: 50%;
        background: var(--accent);
        vertical-align: middle;
      }
      .cell {
        position: absolute;
        border-radius: 20px;
        overflow: hidden;
        background: #dfe2ec;
      }
      .cell img {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cell .ph {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        color: var(--accent);
        background: var(--accent-wash);
      }

      /* highlights */
      .row {
        position: absolute;
        border-radius: 22px;
        background: #ffffff;
        border: 1px solid #d9dce6;
      }
      .row .bar {
        position: absolute;
        border-radius: 8px;
        background: var(--accent);
      }
      .row .val {
        position: absolute;
        font-weight: 650;
        letter-spacing: -0.03em;
        color: #0f1020;
        white-space: nowrap;
      }
      .row .lab {
        position: absolute;
        color: #5c6070;
        white-space: nowrap;
      }

      /* tagline */
      .word {
        position: absolute;
        font-weight: 650;
        letter-spacing: -0.045em;
        line-height: 1;
        white-space: nowrap;
        color: #f4f4f5;
      }
      .word.serif {
        font-weight: 400;
        letter-spacing: -0.01em;
      }

      /* CTA */
      .logo-tile {
        position: absolute;
        border-radius: 44px;
        overflow: hidden;
        background: #ffffff;
        box-shadow: 0 30px 70px -24px rgba(0, 0, 0, 0.8);
      }
      .logo-tile img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .logo-tile .mono {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .brand {
        position: absolute;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1.15;
        color: #f4f4f5;
        white-space: nowrap;
      }
      .sub {
        position: absolute;
        color: #a1a1aa;
        white-space: nowrap;
      }
      .btn {
        position: absolute;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-weight: 650;
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 18px 40px -14px var(--accent-glow);
      }
      .ripple {
        position: absolute;
        border-radius: 50%;
        border: 3px solid var(--accent-bright);
      }

      #shape {
        position: absolute;
        left: 0;
        top: 0;
        background: var(--accent);
        color: var(--on-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        visibility: hidden;
        box-shadow: 0 0 60px var(--accent-glow);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1080"
      data-height="1920"
      data-format="vertical"
      data-length="standard"
      style="width: 1080px; height: 1920px"
    >
      <div id="ground" class="clip" data-start="0" data-duration="30" data-track-index="0">
        <div id="glow-a" class="glow"></div>
        <div id="glow-b" class="glow"></div>
      </div>
      <div id="stage" class="clip" data-start="0" data-duration="30" data-track-index="1"></div>
      <!-- AUDIO -->
    </div>

    <script>
      (function () {
        "use strict";

        var root = document.getElementById("root");
        var stage = document.getElementById("stage");
        var FORMAT = root.getAttribute("data-format") || "vertical";
        var LENGTH = root.getAttribute("data-length") || "standard";

        // ------------------------------------------------------------------ timing
        // Mirrors packages/reels/src/timing.mjs (the build step also reads that file
        // for the audio cues). Keep both in step.
        var SCENES = {
          standard: [
            ["hook", 0, 4],
            ["answer", 4, 9.5],
            ["gallery", 9.5, 15],
            ["highlights", 15, 20],
            ["tagline", 20, 24],
            ["cta", 24, 30],
          ],
          short: [
            ["hook", 0, 3],
            ["answer", 3, 7.5],
            ["tagline", 7.5, 11],
            ["cta", 11, 15],
          ],
        }[LENGTH];

        // ------------------------------------------------------------------ layout
        var LAYOUTS = {
          wide: {
            W: 1920, H: 1080, pad: 140,
            head: { x: 140, y: 540, w: 700, size: 92, maxH: 520, anchor: "middle" },
            hookHead: { x: 900, y: 120, w: 880, size: 66, maxH: 170, anchor: "top" },
            card: { x: 1000, y: 140, w: 780, h: 800 },
            phone: { cx: 560, cy: 540, w: 400, h: 820 },
            bubbleSize: 30,
            comments: [[1180, 540], [1010, 380], [1520, 330], [1560, 640], [1060, 760]],
            ghosts: [[1340, 330], [1730, 470], [880, 560], [1360, 830], [1730, 800], [1300, 430], [1720, 300], [900, 330]],
            gridCols: 3, gridRows: 2,
            tagStack: false, tagSize: 168,
            cta: { cy: 500, logo: 200, brand: 120, sub: 40, btn: 40 },
          },
          vertical: {
            W: 1080, H: 1920, pad: 90,
            head: { x: 90, y: 250, w: 900, size: 100, maxH: 380, anchor: "top" },
            hookHead: { x: 90, y: 250, w: 900, size: 92, maxH: 300, anchor: "top" },
            card: { x: 90, y: 700, w: 900, h: 880 },
            phone: { cx: 540, cy: 1110, w: 440, h: 900 },
            bubbleSize: 36,
            comments: [[780, 880], [290, 770], [800, 1190], [280, 1330], [770, 1480]],
            ghosts: [[170, 1010], [920, 1030], [220, 1600], [900, 1640], [560, 640], [880, 720], [190, 660], [560, 1640]],
            gridCols: 2, gridRows: 3,
            tagStack: true, tagSize: 200,
            cta: { cy: 930, logo: 220, brand: 120, sub: 44, btn: 44 },
          },
          portrait: {
            W: 1080, H: 1350, pad: 80,
            head: { x: 80, y: 110, w: 920, size: 80, maxH: 260, anchor: "top" },
            hookHead: { x: 80, y: 100, w: 920, size: 70, maxH: 200, anchor: "top" },
            card: { x: 80, y: 420, w: 920, h: 790 },
            phone: { cx: 540, cy: 800, w: 340, h: 700 },
            bubbleSize: 30,
            comments: [[760, 650], [300, 560], [790, 900], [290, 1010], [760, 1130]],
            ghosts: [[160, 760], [930, 780], [200, 1180], [920, 1230], [560, 400], [900, 480], [180, 420], [560, 1220]],
            gridCols: 3, gridRows: 2,
            tagStack: true, tagSize: 150,
            cta: { cy: 620, logo: 190, brand: 104, sub: 38, btn: 38 },
          },
        };
        var L = LAYOUTS[FORMAT] || LAYOUTS.vertical;

        // ------------------------------------------------------------------ variables
        function readVariables() {
          var out = {};
          try {
            var decl = JSON.parse(document.documentElement.getAttribute("data-composition-variables") || "[]");
            decl.forEach(function (d) {
              out[d.id] = d.default;
            });
          } catch (e) {}
          var over = null;
          try {
            if (window.__hyperframes && typeof window.__hyperframes.getVariables === "function") {
              over = window.__hyperframes.getVariables();
            }
          } catch (e) {}
          if (!over && window.__hfVariables) over = window.__hfVariables;
          if (over) {
            for (var k in over) {
              if (over[k] !== undefined && over[k] !== null) out[k] = over[k];
            }
          }
          return out;
        }

        function lines(s) {
          return String(s || "")
            .split(/\r?\n/)
            .map(function (x) {
              return x.trim();
            })
            .filter(Boolean);
        }

        // ------------------------------------------------------------------ colour
        function hexToRgb(hex) {
          var h = String(hex || "").replace("#", "");
          if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
          var n = parseInt(h, 16);
          if (isNaN(n) || h.length !== 6) return [61, 126, 255];
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function rgba(c, a) {
          return "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + a + ")";
        }
        function mix(a, b, t) {
          return [0, 1, 2].map(function (i) {
            return Math.round(a[i] + (b[i] - a[i]) * t);
          });
        }
        function hex(c) {
          return (
            "#" +
            c
              .map(function (v) {
                return ("0" + v.toString(16)).slice(-2);
              })
              .join("")
          );
        }
        function luminance(c) {
          var s = c.map(function (v) {
            v /= 255;
            return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * s[0] + 0.7152 * s[1] + 0.0722 * s[2];
        }

        // ------------------------------------------------------------------ dom helpers
        function el(tag, cls, parent, text) {
          var e = document.createElement(tag);
          if (cls) e.className = cls;
          if (text !== undefined && text !== null) e.textContent = text;
          (parent || stage).appendChild(e);
          return e;
        }
        function css(e, o) {
          for (var k in o) {
            var v = o[k];
            e.style[k] = typeof v === "number" && !/opacity|zIndex|fontWeight|lineHeight|flex/.test(k) ? v + "px" : v;
          }
          return e;
        }
        // Rect in canvas pixels, independent of any preview scaling (offset chain).
        function rectOf(e) {
          var x = 0, y = 0, n = e;
          while (n && n !== root) {
            x += n.offsetLeft;
            y += n.offsetTop;
            n = n.offsetParent;
          }
          return { x: x, y: y, w: e.offsetWidth, h: e.offsetHeight, cx: x + e.offsetWidth / 2, cy: y + e.offsetHeight / 2 };
        }
        function initial(s) {
          var t = String(s || "").replace(/^@/, "").trim();
          return t ? Array.from(t)[0].toUpperCase() : "Z";
        }

        // "Every question, *answered*." -> word spans, the starred part in the serif.
        function richWords(parent, text) {
          var parts = String(text || "").split("*");
          var words = [];
          parts.forEach(function (part, i) {
            var serif = i % 2 === 1;
            part.split(/(\s+)/).forEach(function (tok) {
              if (!tok) return;
              if (/^\s+$/.test(tok)) {
                parent.appendChild(document.createTextNode(" "));
                return;
              }
              var w = el("span", "w" + (serif ? " serif" : ""), parent, tok);
              words.push(w);
            });
          });
          return words;
        }

        function makeHeadline(parent, text, spec) {
          var h = el("div", "headline", parent);
          css(h, { left: spec.x, width: spec.w, fontSize: spec.size });
          var words = richWords(h, text);
          var size = spec.size;
          for (var i = 0; i < 12 && h.offsetHeight > spec.maxH; i++) {
            size = Math.round(size * 0.92);
            h.style.fontSize = size + "px";
          }
          var top = spec.anchor === "middle" ? spec.y - h.offsetHeight / 2 : spec.y;
          h.style.top = top + "px";
          return { el: h, words: words };
        }

        // Shrink an element's font until it fits a box (single-line or wrapped).
        function fitFont(e, maxW, maxH, start, min) {
          var size = start;
          e.style.fontSize = size + "px";
          for (var i = 0; i < 30; i++) {
            var okW = !maxW || e.scrollWidth <= maxW + 0.5;
            var okH = !maxH || e.scrollHeight <= maxH + 0.5;
            if ((okW && okH) || size <= min) break;
            size = Math.max(min, Math.round(size * 0.94));
            e.style.fontSize = size + "px";
          }
          return size;
        }

        // Deterministic pseudo-random (no Math.random in a seekable render).
        var seed = 7;
        function rnd() {
          seed = (seed * 16807) % 2147483647;
          return (seed - 1) / 2147483646;
        }

        // ------------------------------------------------------------------ build
        function build() {
          var V = readVariables();
          var W = L.W, H = L.H;
          var DUR = SCENES[SCENES.length - 1][2];

          // colour system from the one brand colour
          var A = hexToRgb(V.accent);
          var lum = luminance(A);
          var onAccent = lum > 0.5 ? "#0F1020" : "#FFFFFF";
          var bright = mix(A, [255, 255, 255], 0.22);
          var deep = mix(A, [8, 8, 11], 0.72);
